# cargo-audit configuration.
#
# The [output] block is what makes the gate BITE: cargo-audit exits 0 on
# `unmaintained` / `unsound` findings by default, so without this deny list a
# gate would pass over precisely the class it was added to police. `quiet` is
# required alongside it or cargo-audit dies with a parse error.

[output]
quiet = true
deny = ["warnings", "unmaintained", "unsound", "yanked"]

[advisories]
# RATCHET. Seeded 2026-09-07 with exactly the advisories firing that day, each
# with the reason it may stand. An entry whose advisory stops firing must be
# DELETED, not left to rot -- cargo-audit reports unused ignores, and a stale
# entry is how an ignore list becomes decorative.
#
# The GTK3 stack (RUSTSEC-2024-0413/0416/0412/0418/0415/0420/0419/0370/0429,
# reached through tray-icon / muda) was deleted 2026-09-21: tray-icon 0.25 +
# muda 0.20 with default-features = false carry no gtk/libappindicator/libxdo
# edge on any target (`cargo tree -i gtk --target all` matches nothing), so
# all nine ignores were removed rather than left stale.
