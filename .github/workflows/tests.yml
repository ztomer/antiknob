name: tests

# ONE job, ONE command: `./tools/gate.sh --full`.
#
# The local pre-push hook runs that exact script (`.githooks/pre-push` execs
# `bash tools/gate.sh --full`), so CI and the developer's machine cannot
# disagree about what "green" means. Enumerating the layers here instead —
# the way this file could easily be written — is how the two drift: a step
# added to tools/gate.sh is then in CI only after someone remembers to add
# it again, and until then nobody knows which one was lying.
#
# There is deliberately NO platform matrix. This is a macOS / Apple-silicon
# product: hidapi for a USB HID knob, CoreGraphics for the CGEventTap, the
# AppKit tray via tray-icon/muda, and a SwiftUI package whose manifest
# declares `.macOS("26.0")`. A linux or windows job could not compile any of
# it, so it would be decoration.
#
# The runner is `macos-26` because ui/Package.swift declares `.macOS("26.0")`
# and Antiknob.app's Info.plist sets LSMinimumSystemVersion 26.0; this label
# schedules and runs on every push and pull request (run 42507102160 passed).

on:
  push:
  pull_request:

# Superseded runs for the same branch report on the commit that replaced
# them, which is the only one anyone reads. Costs one line.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # macOS 26, not `macos-latest`: the Swift package's platform floor and
    # the app's LSMinimumSystemVersion are both 26.0, and `macos-latest`
    # would silently become a lower macOS the day Apple moves it.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # persist-credentials: false on BOTH checkouts. By default checkout
      # leaves the job token in git config (http.<host>.extraheader), and the
      # structural gate's no-credential-in-git-config check refuses it --
      # correctly: nothing after the clone needs it. Second red of this
      # workflow's first day, 2026-10-05.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The house gates live in ONE repo and are consumed through GOH_DIR.
      # Never vendored here: a copy of a checker is a copy that rots, and
      # tools/gate.sh already reads GOH_DIR (falling back to
      # ~/Projects/gates_of_heck), so this is the same resolution the local
      # gate does.
      #
      # Both repositories are PUBLIC as of this writing, so the default
      # GITHUB_TOKEN can read gates_of_heck and no secret is needed. The
      # `secrets.GOH_TOKEN ||` fallback is kept because that is the shape
      # that keeps working if either repository is ever made private — a
      # private second repo comes back "Not Found", not "access denied".
      - name: Check out gates_of_heck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ztomer/gates_of_heck
          ref: v0.95.0   # a NAMED goh release, never the default branch (RUFF.ADOPT2); raise it deliberately
          path: goh
          token: ${{ secrets.GOH_TOKEN || github.token }}
          persist-credentials: false
      # goh's tool floors (python3, shellcheck), met the ONE way goh provides: its
      # goh-floors action reads them from goh's own floor table (gates/required_tools.tsv),
      # so a floor raised there is met here with no edit. GitHub's runners ship python
      # 3.12 and shellcheck 0.9, below goh's floors (goh G7, 2026-10-26).
      - name: Meet goh's tool floors
        uses: ./goh/.github/actions/goh-floors

      # No sibling symlink: Cargo.toml takes the house TUI crate as a pinned
      # git dependency on gates_of_heck (OW.40), so the workspace above this
      # checkout has nothing to do with the build. The goh clone above is for
      # the GATES only, which read it through GOH_DIR.

      # 3.15: the house moved to it on 2026-10-10; the gates run on it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # dtolnay/rust-toolchain publishes no releases -- `stable` is a branch -- so it is
      # pinned by commit (the branch tip on 2026-10-16); moving it is a deliberate edit.
      - name: Toolchain (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: rustfmt, clippy

      # The tools the gate refuses to run without, installed from
      # gates_of_heck's manifest (gates/required_tools.py, pinned to every
      # refusal site by its own test) rather than from a list kept here: a
      # copied list drifts the day a gate gains a requirement, and this
      # workflow's FIRST run went red on exactly that (ShellCheck, after
      # v0.20.0 made missing tools fatal). The script runs on its own line so
      # a failure aborts the step instead of installing nothing and passing,
      # and an EMPTY install list fails too (grep finds nothing, pipefail):
      # for this repo that can only mean layer detection broke. Both checked
      # under bash, 2026-10-05.
      #
      # cargo-audit is this repo's own requirement (tools/repo_gates.sh), not
      # a gates_of_heck one, so it is the one install named here. `--locked`
      # on every cargo install, because a tool install that re-resolves is a
      # dependency change nobody reviewed.
      - name: Install the tools the gate requires
        env:
          GOH_DIR: ${{ github.workspace }}/goh
        run: |
          set -euo pipefail
          cmds="$(python3 "$GOH_DIR/gates/required_tools.py" --repo . --install)"
          printf '%s\n' "$cmds"
          grep -v '^#' <<<"$cmds" | bash -eux
          cargo install cargo-audit --locked

      - name: The gate
        # The SAME entry point the pre-push hook runs. GOH_DIR is exported
        # rather than prefixed per-command because tools/gate.sh and the
        # layer scripts each resolve it themselves.
        env:
          GOH_DIR: ${{ github.workspace }}/goh
        run: ./tools/gate.sh --full
