[package]
name = "antiknob"
version = "0.1.0"
edition = "2021"
authors = ["Tomer Zaidentein <ztomer@gmail.com>"]
description = "Native macOS Apple Silicon configuration utility for the Anticater VK01 Knob"
license = "MIT OR Apache-2.0"

[dependencies]
hidapi = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
eframe = { version = "0.29", features = ["default_fonts"] }
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "antiknob"
path = "src/bin/antiknob.rs"

[[bin]]
name = "antiknob-gui"
path = "src/bin/antiknob_gui.rs"

[lib]
name = "antiknob"
path = "src/lib.rs"
