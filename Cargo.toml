[package]
name = "antiknob"
version = "0.7.0"
edition = "2021"
authors = ["Tomer Zaidentein <ztomer@gmail.com>"]
description = "Native macOS Apple Silicon configuration utility for the Anticater VK01 Knob"
license = "MIT OR Apache-2.0"

[dependencies]
hidapi = "2.6"
rdev = { version = "0.5", features = ["unstable_grab"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.19"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSGraphicsContext", "objc2-core-graphics"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
plist = "1.0"
tray-icon = "0.21"
muda = "0.17"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
# Tray icon decoding for antiknob-daemon (src/bin/antiknob-daemon/tray.rs).
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "antiknob"
path = "src/bin/antiknob/main.rs"

[[bin]]
name = "antiknob-daemon"
path = "src/bin/antiknob-daemon/main.rs"

[lib]
name = "antiknob"
path = "src/lib.rs"
