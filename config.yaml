# ==============================================================================
# Antiknob / Anticater VK01 Knob Configuration (model: ch57x-1)
# Native ARM64 configuration for macOS 27+
# ==============================================================================
# Model identifier for CH57x microcontrollers (VID: 0x1189, PID: 0x8840 / 0x8842)
model: ch57x-1

# Orientation options: normal, upsidedown, clockwise, counterclockwise
orientation: normal

# Hardware layout dimensions:
# - For 1 knob and 3 keys (default): rows: 1, columns: 3, knobs: 1
# - For pure knob with no keys:      rows: 0, columns: 0, knobs: 1 (buttons: [])
rows: 1
columns: 3
knobs: 1

layers:
  # ----------------------------------------------------------------------------
  # Layer 0: Default Media & Audio Controls
  # ----------------------------------------------------------------------------
  # LED identity per layer. This knob has ONE colour -- setting three
  # different colours was tried and every one came out red -- so layers are
  # told apart by EFFECT, not colour. Mode 4 (rainbow) is the multicoloured
  # effect the device ships in. Mode 5 crashes the firmware; never use it.
  - led: "static"
    buttons:
      - ["play", "prev", "next"]
    knobs:
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

  # ----------------------------------------------------------------------------
  # Layer 1: Navigation & Productivity Shortcuts
  # ----------------------------------------------------------------------------
  - led: "ripple"
    buttons:
      - ["cmd-c", "cmd-v", "cmd-z"]
    knobs:
      - ccw: "wheelup"
        press: "click"
        cw: "wheeldown"

  # ----------------------------------------------------------------------------
  # Layer 2: Workspace & Zoom Controls
  # ----------------------------------------------------------------------------
  - led: "rainbow"
    buttons:
      - ["ctrl-left", "ctrl-up", "ctrl-right"]
    knobs:
      - ccw: "cmd-minus"
        press: "cmd-0"
        cw: "cmd-equal"
