# ==============================================================================
# Antiknob / Anticater VK01 Knob Configuration (model: ch57x-1)
# Native ARM64 configuration for macOS 27+
# ==============================================================================
# Model identifier for CH57x microcontrollers (VID: 0x1189, PID: 0x8840 / 0x8842)
model: ch57x-1

# Orientation options: normal, upsidedown, clockwise, counterclockwise
orientation: normal

# Hardware layout dimensions.
#
# MEASURED on 2026-09-08 with `antiknob probe-gestures --map`, which puts a
# distinct marker on keys 1-6, performs all five gestures and reports which
# key each one drove. On this VK01 the answer was:
#
#   key 1  never driven      key 4  twist CW
#   key 2  twist CCW         key 5  hold + twist LEFT
#   key 3  press             key 6  hold + twist RIGHT
#
# So the knob spans FIVE slots starting at key 2, and this device has at most
# ONE button -- there is no room for more. This file used to declare three,
# which pushed every gesture two slots along: `ccw` was written to key 4, the
# CW gesture, and the three declared "buttons" landed on keys 1-3, putting
# `prev` on counter-clockwise and `next` on press. The knob did SOMETHING for
# every gesture, which is exactly why it went unnoticed for so long.
rows: 1
columns: 1
knobs: 1

layers:
  # ----------------------------------------------------------------------------
  # Layer 0: Default Media & Audio Controls
  # ----------------------------------------------------------------------------
  # LED identity per layer, by COLOUR -- which is what was asked for
  # originally and was wrongly recorded as impossible. Setting mode 1 to
  # three different colours produced red every time, and that was read as
  # "this knob has one colour". It is not: mode 1 IS red and mode 2 IS
  # green, each carrying its own colour whatever bytes are sent. So the
  # layers are red, green and multicoloured.
  - led: "red"
    buttons:
      - ["play"]
    knobs:
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"
        # The two gestures this repo spent months saying did not exist.
        hold_twist_l: "prev"
        hold_twist_r: "next"

  # ----------------------------------------------------------------------------
  # Layer 1: Navigation & Productivity Shortcuts
  # ----------------------------------------------------------------------------
  - led: "green"
    buttons:
      - ["cmd-c"]
    knobs:
      - ccw: "wheelup"
        press: "click"
        cw: "wheeldown"
        hold_twist_l: "cmd-leftbracket"
        hold_twist_r: "cmd-rightbracket"

  # ----------------------------------------------------------------------------
  # Layer 2: Workspace & Zoom Controls
  # ----------------------------------------------------------------------------
  - led: "rainbow"
    buttons:
      - ["ctrl-left"]
    knobs:
      - ccw: "cmd-minus"
        press: "cmd-0"
        cw: "cmd-equal"

# A gesture can also run a SEQUENCE, which the vendor's 0xFD command carries
# and the old 0xFE one has no field for. Either shape works:
#
#   press: ["cmd-c", "cmd-v"]        # steps, back to back
#   press:                           # steps, with a wait between them
#     steps: ["cmd-a", "cmd-c"]
#     delay_ms: 120
#
# A slot holds 19 entries, and a chord costs one entry per modifier plus one
# for the key -- so `cmd-c` is two. Only KEYBOARD sequences chain: the
# firmware keeps one media action per slot and drops the rest, so a media
# list is refused when the config loads rather than truncated when it flashes.
#
# This is what makes a gesture able to type a string or drive an application:
# the vendor's own Procreate menu is nothing but named chords, and its Undo
# is Cmd+Z. See VENDOR_UI_MAP.md.
