# ==============================================================================
# Antiknob / Anticater VK01 Knob (Knob-Only Template)
# ==============================================================================
model: ch57x-1
orientation: normal
rows: 0
columns: 0
knobs: 1

layers:
  # Layer 0: System Volume
  - buttons: []
    knobs:
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

  # Layer 1: Mouse Scroll Wheel
  - buttons: []
    knobs:
      - ccw: "wheelup"
        press: "click"
        cw: "wheeldown"

  # Layer 2: Zoom In / Out
  - buttons: []
    knobs:
      - ccw: "cmd-minus"
        press: "cmd-0"
        cw: "cmd-equal"
